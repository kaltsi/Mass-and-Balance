name: Publish test build

on:
  push:
    branches: [python]
    paths:
      - template.html.j2
      - index.html.j2
      - parse_template.py
      - generate_index.py
      - specs/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2

      - run: ./export.sh build

      - name: Build the test site
        run: |
          date="$(git log -1 --format=%ci)"
          mkdir -p testing
          for f in build/*.html; do
            sed 's/\$Format: %ci\$/'"$date"'/' "$f" > "testing/$(basename "$f")"
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./testing
          destination: testing
          keep_files: true
