name: Publish site

on:
  push:
    branches: [master]
    paths:
      - template.html.j2
      - index.html.j2
      - parse_template.py
      - generate_index.py
      - specs/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2

      - run: ./export.sh build

      - name: Build the site
        run: |
          date="$(git log -1 --format=%ci)"
          mkdir -p site
          for f in build/*.html; do
            sed 's/\$Format: %ci\$/'"$date"'/' "$f" > "site/$(basename "$f")"
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          # Clean deploy: the gh-pages branch is wiped before publishing,
          # so it contains only the generated pages at the root.
          keep_files: false
